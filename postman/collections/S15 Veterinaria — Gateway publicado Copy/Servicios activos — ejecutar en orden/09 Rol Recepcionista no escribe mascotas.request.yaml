$kind: http-request
url: "{{baseUrl}}/gateway/mascotas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
