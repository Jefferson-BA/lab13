$kind: http-request
url: "{{baseUrl}}/gateway/clientes/{{clienteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Actualizado S15",
      "apellido": "Postman",
      "dni": "{{dniPrueba}}",
      "telefono": "999123456",
      "email": "{{correoPrueba}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 11000
