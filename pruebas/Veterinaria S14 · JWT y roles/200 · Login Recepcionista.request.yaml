$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "recepcion@veterinaria.test",
      "clave": "Veterinaria2026!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) pm.collectionVariables.set("tokenRecepcionista", pm.response.json().token);
    language: text/javascript
order: 1000
