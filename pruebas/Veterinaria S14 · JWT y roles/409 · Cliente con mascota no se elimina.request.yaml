$kind: http-request
url: "{{baseUrl}}/api/clientes/{{clienteId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenRecepcionista}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 25000
