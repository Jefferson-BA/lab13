$kind: http-request
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Pedro",
      "apellido": "Garcia",
      "dni": "45678901",
      "telefono": "954321098",
      "email": "pedro@example.com"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenVeterinario}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 19000
