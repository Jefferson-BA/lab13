$kind: http-request
url: "{{baseUrl}}/api/mascotas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Toby",
      "especie": "Perro",
      "raza": "Mestizo",
      "edad": 2,
      "clienteId": {{clienteId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenVeterinario}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) pm.collectionVariables.set("mascotaId", pm.response.json().id);
    language: text/javascript
order: 21000
