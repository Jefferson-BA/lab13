$kind: http-request
url: "{{baseUrl}}/api/mascotas/{{mascotaId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenVeterinario}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 204", function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 30000
