$kind: http-request
url: "{{baseUrl}}/api/clientes/{{clienteId}}/mascotas"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenRecepcionista}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 18000
